user  nginx;
worker_processes auto;

# Снимает warn про RLIMIT_NOFILE (worker_connections 4096 требует fd > 1024)
worker_rlimit_nofile 8192;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker embedded DNS — динамический резолв upstream'ов (core-api:8080)
    # Без этого nginx резолвит core-api один раз при старте, падает при рестарте
    resolver 127.0.0.11 valid=10s ipv6=off;

    # X-Forwarded-Proto: Cloudflare присылает "https", для прямых запросов — $scheme
    # Без map core-api будет думать, что клиент на HTTP, и ломать Secure-cookie
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Ограничение размера тела запроса (фото в заказе, аватарки и т.д.)
    client_max_body_size 10m;

    # Rate-limit — раскомментируй limit_req в default.conf.template, когда включишь
    limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
